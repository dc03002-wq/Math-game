<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>숲속 친구들의 10 만들기 수학 탐험</title>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: 'Jua', sans-serif; text-align: center; padding: 20px;
      background: linear-gradient(135deg, #fef9c3 0%, #dcfce7 100%);
      color: #374151; margin: 0; min-height: 100vh; box-sizing: border-box;
    }
    .box {
      background: white; max-width: 460px; margin: 20px auto; padding: 30px 20px;
      border-radius: 28px; border: 4px solid #fde047;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    }
    .avatar-select { display: flex; justify-content: center; gap: 10px; margin: 15px 0; }
    .av-btn {
      font-size: 32px; padding: 10px; border-radius: 15px; border: 3px solid #e2e8f0;
      background: white; cursor: pointer;
    }
    .av-btn.selected { border-color: #22c55e; background: #dcfce7; transform: scale(1.1); }
    .nick-row { display: flex; justify-content: center; gap: 8px; margin-top: 15px; }
    input {
      font-family: 'Jua', sans-serif; padding: 14px; font-size: 20px;
      border: 3px solid #cbd5e1; border-radius: 14px; width: 60%; text-align: center;
    }
    .dice-btn {
      font-family: 'Jua', sans-serif; padding: 14px 16px; font-size: 18px;
      background: #f59e0b; color: white; border: none; border-radius: 14px;
      cursor: pointer; box-shadow: 0 4px 0 #b45309;
    }
    .join-btn {
      font-family: 'Jua', sans-serif; margin-top: 20px; padding: 15px 40px;
      font-size: 22px; background: #22c55e; color: white; border: none;
      border-radius: 16px; cursor: pointer; box-shadow: 0 4px 0 #15803d; width: 85%;
    }
    .q-title { font-size: 38px; margin: 20px 0; color: #1e293b; white-space: pre-line; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
    .opt {
      font-family: 'Jua', sans-serif; padding: 28px 10px; font-size: 32px;
      color: white; border: none; border-radius: 20px; cursor: pointer;
      box-shadow: 0 5px 0 rgba(0,0,0,0.15);
    }
    .opt:active { transform: translateY(3px); box-shadow: none; }
    .c0 { background: #fb7185; }
    .c1 { background: #60a5fa; }
    .c2 { background: #fbbf24; }
    .c3 { background: #34d399; }
    .opt:disabled { opacity: 0.35; cursor: not-allowed; }
    .feedback { font-size: 24px; margin-top: 20px; min-height: 32px; }
  </style>
</head>
<body>
  <div class="box">
    <div id="loginBox">
      <div style="font-size:40px;">🐰 🍎 🐻</div>
      <h1 style="color:#15803d; margin:8px 0;">숲속 수학 탐험대</h1>
      <p style="font-size:18px; color:#64748b;">동물 친구와 나만의 닉네임을 정해요!</p>
      <div class="avatar-select" id="avatarList">
        <button class="av-btn selected" onclick="selectAvatar(this, '🐰')">🐰</button>
        <button class="av-btn" onclick="selectAvatar(this, '🐻')">🐻</button>
        <button class="av-btn" onclick="selectAvatar(this, '🐥')">🐥</button>
        <button class="av-btn" onclick="selectAvatar(this, '🐶')">🐶</button>
      </div>
      <div class="nick-row">
        <input type="text" id="nickInput" placeholder="닉네임 입력" maxlength="10">
        <button class="dice-btn" onclick="randomNick()">🎲 뽑기</button>
      </div>
      <button class="join-btn" onclick="join()">탐험 출발하기! 🚀</button>
    </div>

    <div id="playBox" style="display:none;">
      <div id="myBadge" style="background:#dcfce7; padding:8px 16px; border-radius:20px; font-size:18px; color:#166534;"></div>
      <div class="q-title" id="qTitle">선생님을 기다려요... 🎈</div>
      <div class="grid" id="opts"></div>
      <div class="feedback" id="msg"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'epkyysfmcduadfyayvgw';
    const SUPABASE_KEY = 'sb_publishable_64ZrDSViYYebzwQ0uOKWlg_XxCvlpcn

';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const quizzes = [
      { q: "8 + 5 = ?", opt: ["12", "13", "14", "3"], ans: 1 },
      { q: "9 + 4 = ?", opt: ["13", "12", "15", "5"], ans: 0 },
      { q: "7 + 6 = ?", opt: ["11", "12", "13", "14"], ans: 2 },
      { q: "13 - 5 = ?", opt: ["7", "8", "9", "18"], ans: 1 },
      { q: "15 - 8 = ?", opt: ["6", "7", "8", "23"], ans: 1 },
      { q: "12 - 7 = ?", opt: ["4", "5", "6", "19"], ans: 1 }
    ];

    const adj = ["용감한", "똑똑한", "신나는", "달콤한", "귀여운", "반짝이는"];
    const noun = ["사과", "토끼", "다람쥐", "별님", "딸기", "탐험가"];

    let myNick = '';
    let myAvatar = '🐰';
    let roomData = null;

    function selectAvatar(btn, emoji) {
      document.querySelectorAll('.av-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      myAvatar = emoji;
    }

    function randomNick() {
      const a = adj[Math.floor(Math.random() * adj.length)];
      const n = noun[Math.floor(Math.random() * noun.length)];
      document.getElementById('nickInput').value = `${a} ${n}`;
    }

    async function join() {
      myNick = document.getElementById('nickInput').value.trim();
      if (!myNick) return alert("닉네임을 입력하거나 뽑기 버튼을 눌러주세요! 😊");

      const { data } = await db.from('quiz_room').select('data').eq('id', 1).single();
      roomData = data.data;
      if (!roomData.students) roomData.students = {};
      
      if (roomData.students[myNick]) {
        myNick = `${myNick}_${Math.floor(Math.random() * 90 + 10)}`;
      }

      roomData.students[myNick] = { score: 0, correctCount: 0, lastQ: -1, avatar: myAvatar };
      await db.from('quiz_room').update({ data: roomData }).eq('id', 1);

      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('playBox').style.display = 'block';
      sync();
      setInterval(sync, 1500);
    }

    async function sync() {
      const { data } = await db.from('quiz_room').select('data').eq('id', 1).single();
      if (!data) return;
      roomData = data.data;
      const me = roomData.students[myNick] || { score: 0, lastQ: -1, avatar: myAvatar };
      document.getElementById('myBadge').innerText = `${me.avatar} ${myNick} | 내 별점: ${me.score}점 ⭐`;

      const qTitle = document.getElementById('qTitle');
      const opts = document.getElementById('opts');
      const msg = document.getElementById('msg');

      if (roomData.status === 'WAITING') {
        qTitle.innerText = "선생님이 문제를 낼 때까지 기다려요! 🎈";
        opts.innerHTML = ''; msg.innerText = '';
      } else if (roomData.status === 'PLAYING') {
        const cur = quizzes[roomData.qIndex];
        qTitle.innerText = cur.q;
        const done = (me.lastQ === roomData.qIndex);
        if (!done) msg.innerText = '';
        opts.innerHTML = cur.opt.map((text, i) =>
          `<button class="opt c${i}" ${done ? 'disabled' : ''} onclick="answer(${i})">${text}</button>`
        ).join('');
      } else {
        qTitle.innerText = `🎉 탐험 끝!\n내 점수는 ${me.score}점이에요!`;
        opts.innerHTML = ''; msg.innerText = '참 잘했어요! 👏';
      }
    }

    async function answer(choice) {
      const { data } = await db.from('quiz_room').select('data').eq('id', 1).single();
      roomData = data.data;
      const cur = quizzes[roomData.qIndex];
      const me = roomData.students[myNick];

      if (me.lastQ === roomData.qIndex) return;
      me.lastQ = roomData.qIndex;
      if (choice === cur.ans) {
        me.score += 100;
        me.correctCount = (me.correctCount || 0) + 1;
        document.getElementById('msg').innerText = "⭕ 딩동댕! 참 잘했어요! (+100점)";
        document.getElementById('msg').style.color = "#16a34a";
      } else {
        document.getElementById('msg').innerText = "💦 아깝다! 다음엔 꼭 맞혀봐요!";
        document.getElementById('msg').style.color = "#dc2626";
      }
      await db.from('quiz_room').update({ data: roomData }).eq('id', 1);
      sync();
    }
  </script>
</body>
</html>
