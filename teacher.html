<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>선생님 전용 제어판 - 숲속 수학 탐험</title>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: 'Jua', sans-serif; text-align: center; padding: 20px;
      background: #f0fdf4; color: #374151; margin: 0;
    }
    .container {
      max-width: 850px; margin: 0 auto; background: white;
      padding: 30px; border-radius: 28px; border: 4px solid #86efac;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    }
    .lock-box { max-width: 360px; margin: 80px auto; background: white; padding: 35px; border-radius: 24px; border: 4px solid #93c5fd; }
    .lock-box input { font-family: 'Jua', sans-serif; font-size: 22px; padding: 12px; width: 70%; text-align: center; border-radius: 12px; border: 2px solid #cbd5e1; margin: 15px 0; }
    .badge {
      display: inline-block; background: #fef08a; color: #854d0e;
      padding: 6px 16px; border-radius: 20px; font-size: 18px; margin-bottom: 10px;
    }
    .question-box {
      background: #fffbeb; border: 3px dashed #fbbf24;
      border-radius: 20px; padding: 25px; margin: 15px 0;
    }
    .q-text { font-size: 44px; color: #1e293b; margin: 10px 0; }
    .qr-area { margin: 15px auto; padding: 15px; background: white; display: inline-block; border-radius: 16px; border: 2px solid #e2e8f0; }
    .ten-frame-area { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 15px; }
    .ten-frame { display: grid; grid-template-columns: repeat(5, 42px); gap: 6px; background: #fef3c7; padding: 10px; border-radius: 12px; border: 2px solid #f59e0b; }
    .cell { width: 42px; height: 42px; background: white; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 26px; }
    .hint-box { background: #eff6ff; color: #1d4ed8; padding: 14px; border-radius: 14px; font-size: 22px; margin-top: 15px; display: none; }
    .controls { margin: 20px 0; }
    button {
      font-family: 'Jua', sans-serif; padding: 14px 22px; font-size: 20px;
      cursor: pointer; border: none; border-radius: 15px; margin: 6px;
      color: white; box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    }
    button:active { transform: translateY(2px); box-shadow: none; }
    .btn-next { background: #22c55e; }
    .btn-hint { background: #f59e0b; }
    .btn-end { background: #3b82f6; }
    .btn-reset { background: #ef4444; font-size: 16px; padding: 10px 16px; }
    .board { background: #f8fafc; border-radius: 20px; padding: 20px; margin-top: 20px; text-align: left; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; background: white; border-radius: 12px; overflow: hidden; }
    th, td { padding: 12px 15px; text-align: center; border-bottom: 1px solid #e2e8f0; font-size: 19px; }
    th { background: #dcfce7; color: #166534; }
  </style>
</head>
<body>
  <!-- 선생님 비밀번호 확인창 -->
  <div class="lock-box" id="lockScreen">
    <h2>👩‍🏫 선생님 전용 화면</h2>
    <p style="color:#64748b;">비밀번호를 입력하세요 (초기: 1234)</p>
    <input type="password" id="pwInput" placeholder="비밀번호" onkeyup="if(event.key==='Enter') unlock()">
    <br>
    <button class="btn-end" onclick="unlock()">입장하기</button>
  </div>

  <!-- 메인 제어판 -->
  <div class="container" id="mainScreen" style="display:none;">
    <div class="badge" id="typeBadge">🌳 숲속 수학 교실</div>
    <div class="question-box">
      <div class="q-text" id="qDisplay">친구들이 입장할 때까지 기다려요!</div>
      
      <!-- 학생 입장용 QR코드 자동 표시 영역 -->
      <div id="qrBox" class="qr-area">
        <img id="qrImg" src="" alt="학생 입장 QR코드" width="160" height="160"><br>
        <span style="font-size:16px; color:#475569;">📱 스마트폰으로 QR코드를 찍어 입장하세요!</span>
      </div>

      <div class="ten-frame-area" id="visualArea"></div>
      <div class="hint-box" id="hintBox"></div>
    </div>

    <div class="controls">
      <button class="btn-next" onclick="nextQuestion()">다음 문제 내기 ▶</button>
      <button class="btn-hint" onclick="toggleHint()">💡 10 만들기 힌트</button>
      <button class="btn-end" onclick="endGame()">🏆 결과 발표</button>
      <button class="btn-reset" onclick="resetGame()">기록 초기화</button>
    </div>

    <div class="board">
      <h3 style="margin:0; font-size:22px;">📊 실시간 학생 점수 및 기록 관리</h3>
      <table>
        <thead>
          <tr>
            <th>순위</th>
            <th>닉네임</th>
            <th>맞힌 개수</th>
            <th>총점</th>
            <th>현재 문제 상태</th>
          </tr>
        </thead>
        <tbody id="studentTable"></tbody>
      </table>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'epkyysfmcduadfyayvgw';
    const SUPABASE_KEY = 'sb_publishable_64ZrDSViYYebzwQ0uOKWlg_XxCvlpcn';
    const TEACHER_PW = '1234'; // 원하는 비밀번호로 변경 가능
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const quizzes = [
      { type: "받아올림 덧셈", q: "8 + 5 = ?", a: 8, b: 5, isAdd: true, hint: "💡 5를 2와 3으로 갈라봐요! 8 + 2 = 10, 거기에 3을 더하면?", opt: ["12", "13", "14", "3"], ans: 1 },
      { type: "받아올림 덧셈", q: "9 + 4 = ?", a: 9, b: 4, isAdd: true, hint: "💡 9는 1만 있으면 10이 돼요! 4에서 1을 빌려주면 10 + 3!", opt: ["13", "12", "15", "5"], ans: 0 },
      { type: "받아올림 덧셈", q: "7 + 6 = ?", a: 7, b: 6, isAdd: true, hint: "💡 7이 10이 되려면 3이 필요해요! 6을 3과 3으로 가르면?", opt: ["11", "12", "13", "14"], ans: 2 },
      { type: "받아내림 뺄셈", q: "13 - 5 = ?", a: 13, b: 5, isAdd: false, hint: "💡 10에서 먼저 5를 빼면 5가 남아요! 남은 5와 3을 더하면?", opt: ["7", "8", "9", "18"], ans: 1 },
      { type: "받아내림 뺄셈", q: "15 - 8 = ?", a: 15, b: 8, isAdd: false, hint: "💡 10에서 8을 빼면 2가 남아요! 2와 5를 합쳐볼까요?", opt: ["6", "7", "8", "23"], ans: 1 },
      { type: "받아내림 뺄셈", q: "12 - 7 = ?", a: 12, b: 7, isAdd: false, hint: "💡 10에서 7을 빼면 3! 거기에 2를 더하면 얼마일까요?", opt: ["4", "5", "6", "19"], ans: 1 }
    ];

    let roomData = { status: 'WAITING', qIndex: -1, showHint: false, students: {} };

    function unlock() {
      if (document.getElementById('pwInput').value === TEACHER_PW) {
        document.getElementById('lockScreen').style.display = 'none';
        document.getElementById('mainScreen').style.display = 'block';
        
        // 현재 사이트의 학생용 기본 주소로 QR코드 자동 생성
        const studentUrl = window.location.origin + '/';
        document.getElementById('qrImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(studentUrl)}`;
        
        setInterval(load, 1500);
        load();
      } else {
        alert("비밀번호가 틀렸습니다!");
      }
    }

    async function load() {
      const { data } = await db.from('quiz_room').select('data').eq('id', 1).single();
      if (data) { roomData = data.data; render(); }
    }

    async function save() {
      await db.from('quiz_room').update({ data: roomData }).eq('id', 1);
      render();
    }

    function nextQuestion() {
      const nextIdx = (roomData.status === 'WAITING') ? 0 : roomData.qIndex + 1;
      if (nextIdx >= quizzes.length) return alert("마지막 문제까지 모두 풀었어요! 결과 발표를 눌러주세요 🎉");
      roomData.status = 'PLAYING';
      roomData.qIndex = nextIdx;
      roomData.showHint = false;
      save();
    }

    function toggleHint() {
      if (roomData.status !== 'PLAYING') return;
      roomData.showHint = !roomData.showHint;
      save();
    }

    function endGame() {
      roomData.status = 'END';
      save();
    }

    function resetGame() {
      if (!confirm("모든 학생의 점수와 기록을 초기화할까요?")) return;
      roomData = { status: 'WAITING', qIndex: -1, showHint: false, students: {} };
      save();
    }

    function drawTenFrames(quiz) {
      const area = document.getElementById('visualArea');
      area.innerHTML = '';
      if (!quiz) return;

      let items = [];
      if (quiz.isAdd) {
        for (let i = 0; i < quiz.a; i++) items.push('🍎');
        for (let i = 0; i < quiz.b; i++) items.push('🍏');
      } else {
        for (let i = 0; i < quiz.a; i++) items.push(i < quiz.b ? '❌' : '🍎');
      }

      for (let f = 0; f < 2; f++) {
        const frame = document.createElement('div');
        frame.className = 'ten-frame';
        for (let c = 0; c < 10; c++) {
          const idx = f * 10 + c;
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.innerText = items[idx] || '';
          frame.appendChild(cell);
        }
        area.appendChild(frame);
      }
    }

    function render() {
      const badge = document.getElementById('typeBadge');
      const qDisplay = document.getElementById('qDisplay');
      const hintBox = document.getElementById('hintBox');
      const visualArea = document.getElementById('visualArea');
      const qrBox = document.getElementById('qrBox');

      if (roomData.status === 'WAITING') {
        badge.innerText = "🌳 대기실";
        qDisplay.innerText = "QR코드를 찍고 친구들이 들어오고 있어요!";
        qrBox.style.display = 'inline-block';
        visualArea.innerHTML = '';
        hintBox.style.display = 'none';
      } else if (roomData.status === 'PLAYING') {
        const cur = quizzes[roomData.qIndex];
        badge.innerText = `문제 ${roomData.qIndex + 1} / ${quizzes.length} (${cur.type})`;
        qDisplay.innerText = cur.q;
        qrBox.style.display = 'none';
        drawTenFrames(cur);
        hintBox.innerText = cur.hint;
        hintBox.style.display = roomData.showHint ? 'block' : 'none';
      } else {
        badge.innerText = "🎉 탐험 완료!";
        qDisplay.innerText = "모두 정말 잘했어요! 최종 순위와 기록입니다.";
        qrBox.style.display = 'none';
        visualArea.innerHTML = '';
        hintBox.style.display = 'none';
      }

      const tbody = document.getElementById('studentTable');
      const entries = Object.entries(roomData.students || {}).sort((a, b) => b[1].score - a[1].score);
      tbody.innerHTML = entries.length ? entries.map(([nickname, info], idx) => `
        <tr>
          <td>${idx === 0 && info.score > 0 ? '👑 1위' : `${idx + 1}위`}</td>
          <td><strong>${info.avatar || '🐰'} ${nickname}</strong></td>
          <td>${info.correctCount || 0} / ${quizzes.length}개</td>
          <td style="color:#16a34a; font-weight:bold;">${info.score}점</td>
          <td>${roomData.status === 'PLAYING' ? (info.lastQ === roomData.qIndex ? '✅ 제출완료' : '⏳ 푸는 중') : '-'}</td>
        </tr>
      `).join('') : '<tr><td colspan="5" style="color:#94a3b8;">아직 입장한 학생이 없습니다.</td></tr>';
    }
  </script>
</body>
</html>
